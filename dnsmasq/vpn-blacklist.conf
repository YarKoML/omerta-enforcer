# Omerta Enforcer — DNS-фильтр (блэклист омерты).
# @@BRIDGE_IP@@ заменяется install.sh'ом (или вручную) на IP твоего моста.
# Заблокированный домен и ВСЕ его субдомены резолвятся в 0.0.0.0 / ::.
# Домены добавлять через vpn-block-add.sh или UI — строки допишутся сами.
listen-address=127.0.0.1,@@BRIDGE_IP@@
bind-interfaces
no-resolv
server=1.1.1.1
server=8.8.8.8
cache-size=1000

# ==== BLACKLIST ====
# example.com — проверочный пример, удали и добавь свои через vpn-block-add.sh
address=/example.com/0.0.0.0
address=/example.com/::